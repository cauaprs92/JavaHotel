# Copie este arquivo para "banco.properties" (na mesma pasta) e coloque a senha
# do seu PostgreSQL. O banco.properties fica fora do git.
#
# Antes de rodar pela primeira vez, crie o banco (no pgAdmin ou no psql):
#   CREATE DATABASE javahotel;
# As tabelas são criadas sozinhas quando o servidor inicia.

# jdbc:postgresql://  -> o tipo de banco é PostgreSQL
# localhost           -> o banco está na mesma máquina
# 5432                -> porta padrão do PostgreSQL
# javahotel           -> nome do banco de dados
javahotel.bd.url=jdbc:postgresql://localhost:5432/javahotel
javahotel.bd.usuario=postgres
javahotel.bd.senha=SUA_SENHA_AQUI
