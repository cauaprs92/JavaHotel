<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>JavaHotel · Reservas</title>
    <meta name="description" content="Reservar e cancelar quartos no JavaHotel.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400..600;1,9..144,400..600&family=Inter:wght@400;500;600&display=swap">
    <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="reservas">

    <header class="topo">
        <div class="container">
            <a class="marca" href="index.html"><span class="marca-simbolo">J</span>JavaHotel</a>
            <nav class="nav" aria-label="Principal">
                <a href="index.html" data-nav="inicio">Início</a>
                <a href="quartos.html" data-nav="quartos">Quartos</a>
                <a href="reservas.html" data-nav="reservas">Reservas</a>
                <a href="frigobar.html" data-nav="frigobar">Frigobar</a>
            </nav>
        </div>
    </header>

    <main>
        <div class="container">

            <header class="cabecalho-pagina">
                <span class="sobretitulo">Recepção</span>
                <h1>Reservas</h1>
                <p>Registre a chegada de um hóspede ou encerre uma estadia.</p>
            </header>

            <section class="cartao">
                <h2>Nova reserva</h2>
                <p class="descricao">Só aparecem os quartos livres.</p>
                <form id="form-reservar">
                    <div class="campos-reserva">
                        <div class="campo">
                            <label for="sel-quarto-livre">Quarto</label>
                            <select id="sel-quarto-livre" name="numero" required></select>
                        </div>
                        <div class="campo">
                            <label for="nome">Nome do hóspede</label>
                            <input id="nome" type="text" name="nome" autocomplete="name" placeholder="Maria Souza" required>
                        </div>
                        <div class="campo">
                            <label for="email">E-mail</label>
                            <input id="email" type="email" name="email" autocomplete="email" placeholder="maria@email.com" required>
                        </div>
                        <div class="campo">
                            <label for="telefone">Telefone</label>
                            <input id="telefone" type="tel" name="telefone" autocomplete="tel" placeholder="(11) 90000-0000" required>
                        </div>
                    </div>
                    <div class="form-rodape">
                        <button type="submit" class="botao">Confirmar reserva</button>
                    </div>
                </form>
            </section>

            <section class="secao">
                <div class="secao-titulo">
                    <h2>Reservas ativas</h2>
                    <span class="link-sutil" id="total-reservas"></span>
                </div>
                <div class="reservas" id="lista-reservas"></div>
            </section>

        </div>
    </main>

    <dialog id="dialogo-encerrar" aria-labelledby="encerrar-titulo">
        <div class="dialogo-corpo">
            <div class="icone-perigo" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/></svg>
            </div>
            <h2 id="encerrar-titulo">Encerrar reserva?</h2>
            <p class="dialogo-texto" id="encerrar-texto"></p>
            <div class="botoes-lado">
                <button type="button" class="botao contorno" id="encerrar-voltar">Voltar</button>
                <button type="button" class="botao perigo-cheio" id="encerrar-confirmar">Encerrar reserva</button>
            </div>
        </div>
    </dialog>

    <footer class="rodape">
        <div class="container">
            <span>JavaHotel · projeto de estudos · dados salvos neste navegador</span>
            <button type="button" id="redefinir">Restaurar dados de exemplo</button>
        </div>
    </footer>

    <script src="app.js"></script>
</body>
</html>
