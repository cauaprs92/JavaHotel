# Porta do site. Na nuvem (Render), a plataforma informa a porta pela variável PORT.
server.port=${PORT:8081}

# Pastas com o site: a pasta public/ do projeto (para editar e ver na hora)
# e, como reserva, a cópia que vai dentro do .jar.
spring.web.resources.static-locations=file:./public/,classpath:/static/

# ---------- Banco de dados (PostgreSQL via JDBC) ----------
# Na sua máquina, os valores vêm do arquivo banco.properties (fora do git).
# Na nuvem, vêm das variáveis de ambiente DB_URL, DB_USER e DB_PASSWORD.
spring.config.import=optional:file:./banco.properties

javahotel.bd.url=${DB_URL:jdbc:postgresql://localhost:5432/javahotel}
javahotel.bd.usuario=${DB_USER:postgres}
javahotel.bd.senha=${DB_PASSWORD:}

# Fuso usado para saber qual é o dia de "hoje" nas regras de reserva.
javahotel.fuso=${TZ_HOTEL:America/Sao_Paulo}
